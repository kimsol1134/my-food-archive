name: 책 실습 중 막힘
description: 현재 장과 화면의 오류를 알려 주세요.
title: "[실습 문의] "
body:
  - type: markdown
    attributes:
      value: |
        비밀번호, 인증번호, 결제 정보, 인증서 지문과 비공개 테스트 참여 링크는 적지 마세요.

  - type: input
    id: chapter
    attributes:
      label: 읽고 있는 장과 절
      description: 예) 10장 10.2절
      placeholder: 10장 10.2절
    validations:
      required: true

  - type: dropdown
    id: computer
    attributes:
      label: 사용하는 컴퓨터
      options:
        - Mac
        - Windows
        - 그 밖의 환경
    validations:
      required: true

  - type: dropdown
    id: app_target
    attributes:
      label: 만들고 있는 앱
      options:
        - iPhone 앱
        - Android 앱
        - 아직 모르겠습니다
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 화면에 보이는 오류 문장
      description: 오류 문장을 그대로 붙여 넣거나, 개인정보를 가린 스크린샷을 끌어다 놓아 주세요.
    validations:
      required: true

  - type: textarea
    id: previous_action
    attributes:
      label: 오류 직전에 한 작업
      description: 어떤 버튼을 눌렀거나 어떤 문장을 입력했는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: 이미 해 본 해결 방법
      description: 없다면 비워 두어도 됩니다.

  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 전 확인
      options:
        - label: 비밀번호, 인증번호, 결제 정보, 인증서 지문과 비공개 테스트 참여 링크를 제거했습니다.
          required: true
