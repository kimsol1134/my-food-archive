name: iOS validation

on:
  pull_request:
    paths:
      - "lib/**"
      - "ios/**"
      - "test/**"
      - ".flutter-version"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "ios/**"
      - "test/**"
      - ".flutter-version"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # 책의 고정 참고본은 가변적인 macos-latest 대신 안정판 세대에 고정한다.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: sdk
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Verify locked CocoaPods dependencies
        working-directory: ios
        run: pod install --deployment

      - name: Compile iOS Simulator app
        run: flutter build ios --simulator --debug --no-pub
