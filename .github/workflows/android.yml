name: Android validation

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: sdk
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Compile release bundle
        run: flutter build appbundle --release --no-pub

      # CI에는 업로드 키를 넣지 않는다. 이 단계의 AAB는 컴파일 검증용이며,
      # Play Console 업로드는 docs/RELEASE.md의 로컬 서명 절차를 따른다.
